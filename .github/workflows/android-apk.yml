name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify JavaScript bundle is packaged
        working-directory: android
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle|assets/.*\.wav'

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Freq Music standalone APK build ${{ github.run_number }}
          body: |
            Standalone Freq Music Android release APK.

            This build packages the JavaScript bundle and Listen Together feature, so it does not require Metro, localhost, USB, or a development computer.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: freq-music-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
